<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-labelledby="t" fill="none" stroke="#0f2b52" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <title id="t">Séquence en huit étapes reliant deux territoires en coopération</title>
  <!-- baseline -->
