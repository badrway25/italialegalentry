# Staging-like stack for the performance measurement: Linux, gunicorn, whitenoise with the manifest
# storage, DEBUG=False, PostgreSQL, security headers on. It is NOT production — one host, no TLS
# termination, no CDN, synthetic data — and every number taken from it is labelled as such.
#
# No secret is written in this file. DJANGO_SECRET_KEY and POSTGRES_PASSWORD come from the shell
# environment — or from the git-ignored `.env` next to this file, which `docker compose` reads for
# interpolation — and `${…:?…}` makes the stack refuse to start, naming the variable, when one is
# missing. Generate them locally (`python -c "import secrets; print(secrets.token_urlsafe(50))"`),
# never reuse a value that was ever committed, and never paste one here: a key in a tracked file
# is a published key, however it is labelled.
services:
  # Its own database, deliberately. The first version of this file pointed at the shared `db`
  # service, and `docker compose --profile staging up` recreated it — which killed every open
  # connection and made a pytest run that was already in flight fail with «terminating connection
  # due to administrator command». A staging stack that can knock over the development database is
  # not a staging stack.
  staging-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: ile_staging
      POSTGRES_USER: ile
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it in the environment}"
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ile -d ile_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["staging"]

  staging-web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_all &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?set it in the environment}"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,staging-web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8900,http://localhost:8900
      DATABASE_URL: "postgres://ile:${POSTGRES_PASSWORD:?set it in the environment}@staging-db:5432/ile_staging"
      BACKOFFICE_MFA_ENFORCED: "1"
      # No TLS in front of this container, so the redirect and HSTS are off and the guard rail is
      # told so ON PURPOSE. This is exactly the escape hatch prod.py documents, used exactly once.
      SECURE_SSL_REDIRECT: "false"
      SECURE_HSTS_SECONDS: "0"
      ILE_ALLOW_INSECURE_PROD: "1"
      # NOT set to 1, and it would not matter if it were: config/settings/prod.py pins
      # ILE_SEED_DEMONSTRATION_DATA to False unconditionally, so `rules_activate_demonstration`
      # refuses here and the synthetic-people seeds skip themselves. Discovered by trying: the
      # container's first boot died on that refusal, which is the guard doing its job. The
      # measurement does not need rules in force — the public pages this measures never touch the
      # rule engine — so the step is gone rather than defeated.
      PRIVATE_MEDIA_ROOT: /app/private_media
      ILE_VERSION_LABEL: staging
    ports:
      - "127.0.0.1:8900:8000"
    depends_on:
      staging-db:
        condition: service_healthy
    profiles: ["staging"]
