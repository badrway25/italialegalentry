# Continuous integration — Italy Legal Entry
#
# Runs on every push and pull request to the two published branches. Everything here works on a
# fresh checkout with no secret: the database is a throwaway PostgreSQL service carrying the
# same development credentials as docker-compose.yml, the production settings are never loaded,
# and the only other variables are declared placeholders. The browser suite (marker `browser`,
# Playwright) is excluded: it needs Chromium and runs locally. Nothing here deploys anything.
#
# The same job runs twice (the matrix below), each run on its own runner and its own database:
# * the production target of docs/deployment/PRODUCTION_DEPLOYMENT_RUNBOOK.md — the server's major
#   versions, Python 3.12 and PostgreSQL 16, the ones Ubuntu 24.04 LTS ships (the runbook's step 1);
#   not Ubuntu's own builds: setup-python's CPython 3.12.x and the Alpine image of PostgreSQL 16;
# * the development stack — Python 3.13 (the Dockerfile) and PostgreSQL 17 (docker-compose.yml).
# The runner image is pinned to ubuntu-24.04, the server's release: `ubuntu-latest` moves to
# Ubuntu 26 from 19 October 2026 (GitHub's notice), and a moving image would test neither.
name: CI

on:
  push:
    branches: [main, design-v5]
  pull_request:
    branches: [main, design-v5]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Python ${{ matrix.python }} · PostgreSQL ${{ matrix.postgres }} (${{ matrix.target }}) — check · migrations · ruff · pytest"
    runs-on: ubuntu-24.04
    # ~4 500 non-browser tests against PostgreSQL took about 57 minutes in the fresh-clone rehearsal
    # (DL54-77); a ceiling, not a target.
    timeout-minutes: 90

    strategy:
      # Each run says something the other cannot: a failure on one must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - target: production target
            python: "3.12"
            postgres: "16"
          - target: development
            python: "3.13"
            postgres: "17"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: ile
          POSTGRES_USER: ile
          POSTGRES_PASSWORD: ile-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ile -d ile"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # The throwaway service above, with the development credentials of docker-compose.yml:
      # not a secret, not production.
      DATABASE_URL: postgres://ile:ile-dev-password@127.0.0.1:5432/ile
      # Read by config/settings/test.py; Django derives the test database (test_ile) from it.
      TEST_DATABASE_URL: postgres://ile:ile-dev-password@127.0.0.1:5432/ile
      # The three variables .env.example marks as mandatory in production, with CI-only
      # placeholders. No step loads config.settings.prod, and dev.py / test.py pin or default
      # everything else, so these only keep the job honest about what a deployment must provide.
      DJANGO_SECRET_KEY: ci-only-placeholder-not-a-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      # DJANGO_SETTINGS_MODULE is deliberately NOT set here: manage.py defaults to
      # config.settings.dev and pyproject.toml gives pytest config.settings.test; an environment
      # variable would override the latter for pytest-django.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        # requirements/constraints.txt pins the whole closure of base.txt — the set the server
        # installs (runbook steps 4 and 15) — so every run tests exactly that set; the tools of
        # dev.txt that base.txt does not pull in are resolved around it.
        run: python -m pip install -r requirements/dev.txt -c requirements/constraints.txt

      - name: The interpreter and the database are the matrix's
        # The job's name says which Python and which PostgreSQL it ran on; this step makes the name
        # true: it fails if the interpreter is another minor version or the service another major.
        env:
          PY_VERSION: ${{ matrix.python }}
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; print('Python', sys.version.split()[0]); assert v == os.environ['PY_VERSION'], v"
          python -c "import os, psycopg; v = psycopg.connect(os.environ['DATABASE_URL']).info.server_version // 10000; print('PostgreSQL', v); assert str(v) == os.environ['PG_MAJOR'], v"

      - name: Django system checks
        run: python manage.py check

      - name: Every model change has a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Lint
        run: python -m ruff check . --output-format=github

      - name: Mark the committed bundles as current
        # git does not store modification times, so on a fresh checkout the two mtime-based
        # "bundle is current" tests would compare arbitrary clocks (their docstrings say as much).
        # The content checks in the same test files still fail on a stale bundle.
        run: find static/js/dist static/css/dist -type f -exec touch {} +

      - name: Tests (everything but the browser suite)
        run: python -m pytest -m "not browser" --durations=15
