{% load allauth %}
<section class="account-panel">
  <h2 class="account-panel__title">{% slot title %}{% endslot %}</h2>
  {% slot body %}{% endslot %}
  {% if slots.actions %}
  <ul class="account-panel__actions" role="list">
    {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
  </ul>
  {% endif %}
</section>
